name: Build
on:
  pull_request:
  push:
    branches:
      - master
jobs:
  Xbox:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Install prerequisites
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake flex bison clang-20 lld-20 git llvm-20 python3 pkg-config
        echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

    - name: Check host regression and build helpers
      run: |
        python3 -m py_compile scripts/*.py
        bash -n scripts/build-nxdk.sh
        mkdir -p build/condition-host
        c++ -std=c++17 -pthread -DNXDK -Itests/threads/host -Ixbmc tests/threads/host/condition.cpp -o build/condition-host/test
        build/condition-host/test

    - name: Pull NXDK
      run: |
        python3 scripts/bootstrap-nxdk.py
        echo "NXDK_DIR=$GITHUB_WORKSPACE/.local/nxdk" >> $GITHUB_ENV

    - name: Compile Kodi and NXDK
      run: |
        JOBS=$(nproc) bash scripts/build-nxdk.sh

    - name: Compile exception and RTTI runtime checks
      run: |
        export PATH="$NXDK_DIR/bin:$PATH"
        mkdir -p build/runtime
        make -C build/runtime -f "$GITHUB_WORKSPACE/tests/nxdk-runtime/Makefile" -j$(nproc)

    - name: Prepare release
      run: |
        cd build
        mkdir Kodi
        cp -r xiso/* Kodi/
        zip -r Kodi.zip Kodi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kodi-nxdk-${{ github.sha }}
        path: |
          build/Kodi.iso
          build/Kodi.zip
          build/runtime/bin/default.xbe
          .local/nxdk/.kodi-toolchain.json
        include-hidden-files: true
        if-no-files-found: error
